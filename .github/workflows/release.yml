name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Release tags must point to the default branch history"
            exit 1
          fi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Validate release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::Expected vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Restore locked dependencies
        run: dotnet restore dotnet-plugin-sdk.slnx --locked-mode
      - name: Check formatting
        run: dotnet format dotnet-plugin-sdk.slnx --no-restore --verify-no-changes
      - name: Build
        run: >-
          dotnet build dotnet-plugin-sdk.slnx
          --configuration Release --no-restore
          -p:Version="$VERSION"
      - name: Test
        run: >-
          dotnet test tests/Onelastleaf.PluginSdk.Tests/Onelastleaf.PluginSdk.Tests.csproj
          --configuration Release --no-build
      - name: Pack
        run: >-
          dotnet pack src/Onelastleaf.PluginSdk/Onelastleaf.PluginSdk.csproj
          --configuration Release --no-build --output artifacts
          -p:Version="$VERSION"
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: artifacts
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Obtain temporary NuGet API key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to nuget.org
        shell: bash
        run: |
          packages=(artifacts/*.nupkg)
          if (( ${#packages[@]} != 1 )) || [[ ! -f "${packages[0]}" ]]; then
            echo "::error::Expected exactly one NuGet package"
            exit 1
          fi
          dotnet nuget push "${packages[0]}" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json
